<div class="ventas-layout">
  <app-orden-resumen
    [items]="itemsOrden"
    [total]="total"
    etiquetaResponsable="Encargado"
    nombreResponsable="Juan P."
    textoBoton="PAGAR">
  </app-orden-resumen>

  <div class="ventas-catalogo">
    <div class="categorias">
      @for (categoria of categorias; track categoria) {
        <button type="button" class="categoria-btn">{{ categoria }}</button>
      }
    </div>

    <div class="productos-grid">
      @for (producto of productos; track producto.id) {
        <app-producto-card
          [nombre]="producto.nombre"
          [imagen]="producto.imagen"
          [etiqueta]="'$' + producto.precio.toFixed(2)">
        </app-producto-card>
      }
    </div>
  </div>
</div>
